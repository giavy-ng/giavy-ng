<svg width="100%" height="auto" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <title>Closing Constellation — footer</title>
  <desc>Quiet closing visual: a faint constellation, a thank-you line, and a small crescent moon signature.</desc>

  <defs>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="haloGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- crescent cut via luminance mask: true transparency, works against any fill -->
    <mask id="moonMask" maskUnits="userSpaceOnUse" x="1110" y="150" width="60" height="60">
      <circle cx="1140" cy="178" r="10" fill="#FFFFFF"/>
      <circle cx="1145" cy="174" r="9" fill="#000000"/>
    </mask>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <!-- solid navy matching the header banner's dominant mid-tone stop (#0D1B2A) -->
  <rect x="0" y="0" width="1200" height="220" fill="#0D1B2A"/>

  <!-- ============ CONSTELLATION (atmospheric, sits above the text) ============ -->
  <g stroke="#7CC4FF" stroke-width="1" fill="none" opacity="0.16">
    <path d="M330,68 Q460,40 580,44"/>
    <path d="M580,44 Q715,35 850,60"/>
  </g>

  <g fill="#7CC4FF">
    <circle cx="580" cy="44" r="3" opacity="0.6" filter="url(#softGlow)"/>
    <circle cx="330" cy="68" r="2.5" opacity="0.4"/>
    <circle cx="850" cy="60" r="2.5" opacity="0.36"/>
    <circle cx="205" cy="128" r="2" opacity="0.26"/>
    <circle cx="985" cy="145" r="2" opacity="0.24"/>
    <circle cx="150" cy="50" r="1.5" opacity="0.18"/>
    <circle cx="710" cy="38" r="1.3" opacity="0.16"/>
    <circle cx="1035" cy="95" r="1.4" opacity="0.17"/>
  </g>

  <!-- ============ TEXT ============ -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="580" y="118" font-size="24" font-weight="600" fill="#D6E2F0">
      Thank you for exploring my portfolio!
    </text>
    <text x="580" y="144" font-size="16" font-weight="400" font-style="italic" fill="#9FB3C8">
      Hope you find something worth exploring
    </text>
  </g>

  <!-- ============ MOON SIGNATURE (lower right) ============ -->
  <circle cx="1140" cy="178" r="15" fill="#7CC4FF" opacity="0.10" filter="url(#haloGlow)"/>
  <circle cx="1140" cy="178" r="10" fill="#D6E2F0" opacity="0.85" mask="url(#moonMask)"/>
</svg>
