<svg
  width="1280"
  height="360"
  viewBox="0 0 1280 360"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Gia Vy, Aspiring Data and Analytics Professional"
>
  <title>Gia Vy — Data &amp; Analytics</title>

  <defs>

    <!-- ==================== BACKGROUND ==================== -->

    <radialGradient
      id="bgGlow"
      cx="900"
      cy="120"
      r="820"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#16304A"/>
      <stop offset="42%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#08111F"/>
    </radialGradient>

    <!-- ==================== CONSTELLATION GLOW ==================== -->

    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop
        offset="0%"
        stop-color="#7CC4FF"
        stop-opacity="0.40"
      />
      <stop
        offset="100%"
        stop-color="#7CC4FF"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- ==================== MOON GLOW ==================== -->

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop
        offset="0%"
        stop-color="#7CC4FF"
        stop-opacity="0.50"
      />
      <stop
        offset="100%"
        stop-color="#7CC4FF"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- ==================== SOFT BLUR ==================== -->

    <filter
      id="blurSoft"
      x="-120%"
      y="-120%"
      width="340%"
      height="340%"
    >
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- ==================== MOON MASK ==================== -->

    <mask
      id="moonMask"
      maskUnits="userSpaceOnUse"
      x="-20"
      y="-20"
      width="40"
      height="40"
    >
      <rect
        x="-20"
        y="-20"
        width="40"
        height="40"
        fill="black"
      />

      <circle
        cx="0"
        cy="0"
        r="10"
        fill="white"
      />

      <circle
        cx="3.6"
        cy="-2.6"
        r="9.3"
        fill="black"
      />
    </mask>

    <!-- ==================== TYPOGRAPHY ==================== -->

    <style>
      text {
        font-family:
          'Inter',
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }

      .name {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: 4px;
        fill: #FFFFFF;
      }

      .role {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.4px;
        fill: #7CC4FF;
      }

      .tagline {
        font-size: 16px;
        font-weight: 400;
        fill: #A6B3C7;
      }

      .micro {
        font-size: 12px;
        font-weight: 400;
        fill: #B7C3D6;
      }

      .micro-icon {
        fill: #7CC4FF;
      }
    </style>

  </defs>


  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

  <rect
    width="1280"
    height="360"
    fill="url(#bgGlow)"
  />


  <!-- =====================================================
       CONSTELLATION — RIGHT SIDE
       Compact arrangement to preserve visual depth
       without making the banner vertically tall.
       ===================================================== -->

  <g
    stroke="#7CC4FF"
    stroke-width="0.8"
    opacity="0.10"
    fill="none"
  >

    <!-- Upper constellation -->
    <line x1="930" y1="118" x2="968" y2="82"/>
    <line x1="930" y1="118" x2="930" y2="178"/>
    <line x1="968" y1="82" x2="1055" y2="70"/>
    <line x1="968" y1="82" x2="930" y2="178"/>

    <!-- Central constellation -->
    <line x1="930" y1="178" x2="1015" y2="214"/>
    <line x1="930" y1="178" x2="850" y2="160"/>
    <line x1="850" y1="160" x2="800" y2="118"/>
    <line x1="850" y1="160" x2="820" y2="225"/>

    <!-- Lower constellation -->
    <line x1="1015" y1="214" x2="1080" y2="180"/>
    <line x1="1015" y1="214" x2="980" y2="292"/>
    <line x1="1015" y1="214" x2="1080" y2="270"/>
    <line x1="980" y1="292" x2="1080" y2="270"/>

    <!-- Outer connections -->
    <line x1="1080" y1="180" x2="1175" y2="130"/>
    <line x1="1080" y1="270" x2="1170" y2="300"/>
    <line x1="800" y1="118" x2="760" y2="78"/>
    <line x1="820" y1="225" x2="760" y2="270"/>

    <!-- Subtle secondary connections -->
    <line x1="760" y1="78" x2="790" y2="40"/>
    <line x1="1055" y1="70" x2="1125" y2="52"/>
    <line x1="1175" y1="130" x2="1205" y2="90"/>

  </g>


  <!-- =====================================================
       CONSTELLATION NODES
       ===================================================== -->

  <g
    fill="#7CC4FF"
    opacity="0.22"
  >

    <circle cx="930" cy="118" r="2.7"/>
    <circle cx="968" cy="82" r="1.8"/>
    <circle cx="1055" cy="70" r="1.9"/>

    <circle cx="930" cy="178" r="2.1"/>
    <circle cx="850" cy="160" r="2.3"/>
    <circle cx="800" cy="118" r="1.7"/>
    <circle cx="820" cy="225" r="2.0"/>

    <circle cx="1015" cy="214" r="2.7"/>
    <circle cx="1080" cy="180" r="1.8"/>
    <circle cx="980" cy="292" r="2.2"/>
    <circle cx="1080" cy="270" r="1.9"/>

    <circle cx="1175" cy="130" r="1.7"/>
    <circle cx="1170" cy="300" r="1.8"/>

    <circle cx="760" cy="78" r="1.6"/>
    <circle cx="760" cy="270" r="1.7"/>

    <circle cx="790" cy="40" r="1.5"/>
    <circle cx="1125" cy="52" r="1.5"/>
    <circle cx="1205" cy="90" r="1.6"/>

  </g>


  <!-- =====================================================
       HERO NODES
       ===================================================== -->

  <g>

    <circle
      cx="930"
      cy="178"
      r="17"
      fill="url(#heroGlow)"
    />

    <circle
      cx="930"
      cy="178"
      r="3.4"
      fill="#CFE7FF"
      opacity="0.55"
    />


    <circle
      cx="1015"
      cy="214"
      r="17"
      fill="url(#heroGlow)"
    />

    <circle
      cx="1015"
      cy="214"
      r="3.4"
      fill="#CFE7FF"
      opacity="0.55"
    />

  </g>


  <!-- =====================================================
       SUBTLE DATA PULSE
       ===================================================== -->

  <circle
    r="2.3"
    fill="#EAF4FF"
    opacity="0"
  >

    <animateMotion
      dur="16s"
      repeatCount="indefinite"
      path="
        M 930 178
        L 968 82
        L 1055 70
      "
    />

    <animate
      attributeName="opacity"
      values="0;0;0.85;0.85;0;0"
      keyTimes="0;0.04;0.14;0.86;0.96;1"
      dur="16s"
      repeatCount="indefinite"
    />

  </circle>


  <!-- =====================================================
       MAIN TEXT BLOCK
       ===================================================== -->

  <g>

    <text
      x="94"
      y="142"
      class="name"
    >
      GIA VY
    </text>

    <text
      x="96"
      y="186"
      class="role"
    >
      Aspiring Data &amp; Analytics Professional
    </text>

    <text
      x="96"
      y="232"
      class="tagline"
    >
      Uncovering Stories Hidden in Data
    </text>

    <text
      x="96"
      y="260"
      class="tagline"
    >
      Bridging the Gap Between Data and Business
    </text>

  </g>


  <!-- =====================================================
       MOON
       Small decorative element in upper-right corner
       ===================================================== -->

  <g
    transform="translate(1222,52)"
  >

    <circle
      r="15"
      fill="url(#moonGlow)"
      filter="url(#blurSoft)"
    />

    <g mask="url(#moonMask)">
      <rect
        x="-12"
        y="-12"
        width="24"
        height="24"
        fill="#EAF4FF"
      />
    </g>

  </g>


  <!-- =====================================================
       PERSONALITY MICRO-TEXT
       ===================================================== -->

  <g text-anchor="end">

    <text
      x="1218"
      y="94"
      class="micro"
    >
      <tspan class="micro-icon">&#10022;</tspan>
      <tspan dx="6">Always Curious</tspan>
    </text>

    <text
      x="1218"
      y="116"
      class="micro"
    >
      <tspan class="micro-icon">&#10022;</tspan>
      <tspan dx="6">Always Learning</tspan>
    </text>

    <text
      x="1218"
      y="138"
      class="micro"
    >
      <tspan class="micro-icon">&#8599;</tspan>
      <tspan dx="6">Open to New Opportunities</tspan>
    </text>

  </g>

</svg>