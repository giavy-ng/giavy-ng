<svg width="100%" height="auto" viewBox="0 0 320 298" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sales Pipeline Dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<style>
